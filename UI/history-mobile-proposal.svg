<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title desc">
  <title id="title">Analysis History mobile layout proposal</title>
  <desc id="desc">Illustrative 390 by 844 mobile design showing a History modal with dedicated search, sort, storage, saved record and action rows.</desc>
  <rect width="390" height="844" fill="#eef1f6"/>
  <text x="14" y="35" fill="#111827" font-family="Arial,sans-serif" font-size="18" font-weight="700">AI Analysis</text>
  <rect x="238" y="7" width="43" height="43" rx="5" fill="#f1f3f7" stroke="#cbd2dc"/>
  <text x="251" y="34" fill="#475569" font-family="Arial,sans-serif" font-size="17">◷</text>
  <rect x="285" y="7" width="43" height="43" rx="5" fill="#f1f3f7" stroke="#cbd2dc"/>
  <text x="298" y="34" fill="#475569" font-family="Arial,sans-serif" font-size="15">&lt;/&gt;</text>
  <rect x="333" y="7" width="43" height="43" rx="5" fill="#26479b"/>
  <text x="346" y="34" fill="#fff" font-family="Arial,sans-serif" font-size="17">☏</text>
  <rect x="12" y="67" width="366" height="763" rx="12" fill="none" stroke="#cbd2dc" stroke-dasharray="4 4"/>
  <rect x="12" y="84" width="366" height="676" rx="13" fill="#fff" stroke="#d9dee7"/>
  <text x="28" y="116" fill="#171c29" font-family="Arial,sans-serif" font-size="16" font-weight="700">Analysis History</text>
  <text x="28" y="136" fill="#647084" font-family="Arial,sans-serif" font-size="11">Your reports are saved unencrypted in this browser.</text>
  <text x="335" y="125" fill="#475569" font-family="Arial,sans-serif" font-size="22">×</text>
  <line x1="13" y1="151" x2="377" y2="151" stroke="#eef0f4"/>
  <rect x="28" y="163" width="334" height="40" rx="7" fill="#f8fafc" stroke="#d8dee8"/>
  <text x="39" y="188" fill="#273244" font-family="Arial,sans-serif" font-size="13">Search saved analyses</text>
  <line x1="13" y1="212" x2="377" y2="212" stroke="#eef0f4"/>
  <!-- Single, full-width sort row: 44 px high -->
  <rect x="20" y="216" width="350" height="44" rx="5" fill="#fff"/>
  <text x="28" y="243" fill="#647084" font-family="Arial,sans-serif" font-size="12">Sort by</text>
  <rect x="91" y="222" width="78" height="32" rx="5" fill="#edf2ff"/>
  <text x="99" y="242" fill="#24489b" font-family="Arial,sans-serif" font-size="11" font-weight="700">Name ↓</text>
  <text x="181" y="242" fill="#344054" font-family="Arial,sans-serif" font-size="11">Modified</text>
  <text x="254" y="242" fill="#344054" font-family="Arial,sans-serif" font-size="11">Created</text>
  <line x1="13" y1="263" x2="377" y2="263" stroke="#eef0f4"/>
  <!-- Separate storage/clear row: 44 px high -->
  <rect x="20" y="264" width="350" height="44" rx="5" fill="#fff"/>
  <text x="28" y="291" fill="#647084" font-family="Arial,sans-serif" font-size="12">Storage</text>
  <text x="96" y="291" fill="#273244" font-family="Arial,sans-serif" font-size="12">10.0 MB</text>
  <line x1="169" y1="275" x2="169" y2="297" stroke="#d8dee8"/>
  <text x="191" y="291" fill="#647084" font-family="Arial,sans-serif" font-size="12">2 saved</text>
  <rect x="291" y="269" width="70" height="34" rx="5" fill="#fff" stroke="#e3bcbc"/>
  <text x="306" y="291" fill="#a33b3b" font-family="Arial,sans-serif" font-size="12">Clear all</text>
  <line x1="13" y1="309" x2="377" y2="309" stroke="#eef0f4"/>
  <!-- Record one -->
  <rect x="20" y="310" width="350" height="128" fill="#fff"/>
  <rect x="28" y="322" width="34" height="34" rx="7" fill="#f1f5f9"/>
  <path d="M40 330h9l5 5v13H40z M49 330v5h5" fill="none" stroke="#64748b" stroke-width="1.3"/>
  <text x="70" y="335" fill="#1f2937" font-family="Arial,sans-serif" font-size="13" font-weight="700">Quarterly sales overview</text>
  <text x="70" y="355" fill="#718096" font-family="Arial,sans-serif" font-size="11">Created  ·  29 Sep 2026, 09:26</text>
  <text x="70" y="372" fill="#718096" font-family="Arial,sans-serif" font-size="11">Modified · 29 Sep 2026, 09:28</text>
  <rect x="70" y="383" width="179" height="44" rx="6" fill="#fff" stroke="#cbd5e1"/>
  <text x="91" y="410" fill="#273244" font-family="Arial,sans-serif" font-size="12" font-weight="600">Resume analysis</text>
  <rect x="262" y="383" width="44" height="44" rx="6" fill="#fff" stroke="#cbd5e1"/>
  <text x="277" y="410" fill="#475569" font-family="Arial,sans-serif" font-size="20">⋮</text>
  <line x1="28" y1="437" x2="362" y2="437" stroke="#eef0f4"/>
  <!-- Record two -->
  <rect x="20" y="438" width="350" height="128" fill="#fff"/>
  <rect x="28" y="450" width="34" height="34" rx="7" fill="#f1f5f9"/>
  <path d="M40 458h9l5 5v13H40z M49 458v5h5" fill="none" stroke="#64748b" stroke-width="1.3"/>
  <text x="70" y="463" fill="#1f2937" font-family="Arial,sans-serif" font-size="13" font-weight="700">Customer feedback summary</text>
  <text x="70" y="483" fill="#718096" font-family="Arial,sans-serif" font-size="11">Created  ·  28 Sep 2026, 16:41</text>
  <text x="70" y="500" fill="#718096" font-family="Arial,sans-serif" font-size="11">Modified · 29 Sep 2026, 09:24</text>
  <rect x="70" y="511" width="179" height="44" rx="6" fill="#fff" stroke="#cbd5e1"/>
  <text x="91" y="538" fill="#273244" font-family="Arial,sans-serif" font-size="12" font-weight="600">Resume analysis</text>
  <rect x="262" y="511" width="44" height="44" rx="6" fill="#fff" stroke="#cbd5e1"/>
  <text x="277" y="538" fill="#475569" font-family="Arial,sans-serif" font-size="20">⋮</text>
  <line x1="28" y1="565" x2="362" y2="565" stroke="#eef0f4"/>
  <!-- Previous versions toggle: 44 px high -->
  <rect x="28" y="566" width="334" height="44" rx="5" fill="#f8fafc"/>
  <text x="42" y="593" fill="#475569" font-family="Arial,sans-serif" font-size="12">⌄</text>
  <text x="60" y="593" fill="#475569" font-family="Arial,sans-serif" font-size="12" font-weight="600">Show 1 previous version</text>
  <text x="337" y="593" fill="#718096" font-family="Arial,sans-serif" font-size="11">1</text>
  <line x1="28" y1="611" x2="362" y2="611" stroke="#eef0f4"/>
  <text x="28" y="646" fill="#94a3b8" font-family="Arial,sans-serif" font-size="11">Version details appear here when expanded.</text>
  <text x="195" y="813" text-anchor="middle" fill="#64748b" font-family="Arial,sans-serif" font-size="11" font-weight="700">ILLUSTRATIVE PROPOSAL · NOT A SCREENSHOT</text>
</svg>
