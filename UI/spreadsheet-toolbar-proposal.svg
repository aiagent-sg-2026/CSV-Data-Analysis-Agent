<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="1010" viewBox="0 0 1760 1010" role="img" aria-labelledby="title desc">
  <title id="title">Illustrative Raw Data Explorer toolbar proposal</title>
  <desc id="desc">Proposed desktop and mobile toolbar layouts, preserving current labels and actions. This is an illustration, not an actual screenshot.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="8" flood-color="#25324a" flood-opacity="0.07"/>
    </filter>
    <clipPath id="mobileSearchText">
      <rect x="1378" y="410" width="294" height="28"/>
    </clipPath>
  </defs>
  <rect width="1760" height="1010" fill="#f4f6fa"/>

  <text x="32" y="38" fill="#7250cb" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">TOOLBAR PROPOSAL</text>
  <rect x="224" y="17" width="292" height="30" rx="15" fill="#f0ebff" stroke="#d9cdfb"/>
  <text x="370" y="37" text-anchor="middle" fill="#6844bd" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing=".4">ILLUSTRATION · NOT AN ACTUAL SCREENSHOT</text>
  <text x="32" y="78" fill="#172033" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700">Raw Data Explorer toolbar</text>
  <text x="32" y="101" fill="#5d687b" font-family="Inter, Arial, sans-serif" font-size="14">Touch-sized controls, preserved actions, and a compact mobile flow.</text>

  <text x="32" y="126" fill="#566176" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing=".7">DESKTOP · 1280 × 720</text>
  <text x="1336" y="126" fill="#566176" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing=".7">MOBILE · 390 × 844</text>

  <!-- Desktop toolbar in context -->
  <g filter="url(#shadow)">
    <rect x="32" y="136" width="1280" height="430" rx="14" fill="#ffffff" stroke="#dce2eb"/>
  </g>
  <text x="56" y="174" fill="#182131" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="700">Raw Data Explorer</text>
  <text x="56" y="198" fill="#667184" font-family="Inter, Arial, sans-serif" font-size="12.5">File: codex-qa-advanced-90.csv</text>
  <path d="M1280 169l6-6 6 6" fill="none" stroke="#536075" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="56" y1="216" x2="1288" y2="216" stroke="#edf0f5"/>

  <!-- Desktop source tabs: 44px high -->
  <rect x="56" y="234" width="408" height="44" rx="8" fill="#f1f4f9"/>
  <rect x="58" y="236" width="132" height="40" rx="6" fill="#ffffff" stroke="#d8deea"/>
  <text x="124" y="263" text-anchor="middle" fill="#222b3c" font-family="Inter, Arial, sans-serif" font-size="13.5" font-weight="600">Prepared Data</text>
  <text x="260" y="263" text-anchor="middle" fill="#566176" font-family="Inter, Arial, sans-serif" font-size="13.5">All Prepared</text>
  <text x="394" y="263" text-anchor="middle" fill="#566176" font-family="Inter, Arial, sans-serif" font-size="13.5">Original CSV</text>

  <!-- Desktop view selector: 44px high -->
  <rect x="488" y="234" width="224" height="44" rx="8" fill="#f1f4f9"/>
  <text x="544" y="263" text-anchor="middle" fill="#566176" font-family="Inter, Arial, sans-serif" font-size="13.5">View Data</text>
  <rect x="600" y="236" width="110" height="40" rx="6" fill="#ffffff" stroke="#d8deea"/>
  <text x="655" y="263" text-anchor="middle" fill="#242d40" font-family="Inter, Arial, sans-serif" font-size="13.5" font-weight="600">Group By Test</text>

  <text x="736" y="260" fill="#536075" font-family="Inter, Arial, sans-serif" font-size="13">Showing cleaned prepared data.</text>
  <rect x="958" y="242" width="226" height="28" rx="14" fill="#fff2c7" stroke="#f5dfa0"/>
  <text x="1071" y="260.5" text-anchor="middle" fill="#73551a" font-family="Inter, Arial, sans-serif" font-size="11.5" font-weight="700">No Data Edits Applied Yet</text>

  <!-- Desktop search and Ask AI -->
  <rect x="56" y="300" width="1060" height="44" rx="8" fill="#ffffff" stroke="#cfd7e4"/>
  <circle cx="76" cy="321" r="5.5" fill="none" stroke="#8d99aa" stroke-width="1.5"/>
  <path d="M80.2 325.2l4.3 4.3" stroke="#8d99aa" stroke-width="1.5" stroke-linecap="round"/>
  <text x="94" y="326" fill="#8490a1" font-family="Inter, Arial, sans-serif" font-size="13.5">Search table or ask AI (e.g., 'show rows where column_3 &gt; 100')</text>
  <rect x="1128" y="300" width="160" height="44" rx="8" fill="#7eacf0"/>
  <path d="M1148 309l2.7 5.3 5.8.8-4.2 4.1 1 5.8-5.3-2.8-5.2 2.8 1-5.8-4.3-4.1 5.9-.8z" fill="#ffffff"/>
  <text x="1200" y="327" text-anchor="middle" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700">Ask AI</text>

  <!-- Mobile viewport, drawn at its stated 390 × 844 size -->
  <g filter="url(#shadow)">
    <rect x="1336" y="136" width="390" height="844" rx="14" fill="#ffffff" stroke="#dce2eb"/>
  </g>
  <text x="1352" y="174" fill="#182131" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">Raw Data Explorer</text>
  <text x="1352" y="198" fill="#667184" font-family="Inter, Arial, sans-serif" font-size="12">File: codex-qa-advanced-90.csv</text>
  <path d="M1693 169l6-6 6 6" fill="none" stroke="#536075" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="1352" y1="216" x2="1710" y2="216" stroke="#edf0f5"/>

  <!-- Mobile source tabs: equal-width 44px targets -->
  <rect x="1352" y="232" width="358" height="44" rx="8" fill="#f1f4f9"/>
  <rect x="1354" y="234" width="115" height="40" rx="6" fill="#ffffff" stroke="#d8deea"/>
  <text x="1411.5" y="259" text-anchor="middle" fill="#222b3c" font-family="Inter, Arial, sans-serif" font-size="11.2" font-weight="600">Prepared Data</text>
  <text x="1529" y="259" text-anchor="middle" fill="#566176" font-family="Inter, Arial, sans-serif" font-size="11.2">All Prepared</text>
  <text x="1650" y="259" text-anchor="middle" fill="#566176" font-family="Inter, Arial, sans-serif" font-size="11.2">Original CSV</text>

  <!-- Mobile view selector: 44px high -->
  <rect x="1352" y="286" width="358" height="44" rx="8" fill="#f1f4f9"/>
  <text x="1441" y="313" text-anchor="middle" fill="#566176" font-family="Inter, Arial, sans-serif" font-size="13">View Data</text>
  <rect x="1532" y="288" width="176" height="40" rx="6" fill="#ffffff" stroke="#d8deea"/>
  <text x="1620" y="313" text-anchor="middle" fill="#242d40" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600">Group By Test</text>

  <text x="1352" y="354" fill="#536075" font-family="Inter, Arial, sans-serif" font-size="12.5">Showing cleaned prepared data.</text>
  <rect x="1352" y="365" width="194" height="24" rx="12" fill="#fff2c7" stroke="#f5dfa0"/>
  <text x="1449" y="381" text-anchor="middle" fill="#73551a" font-family="Inter, Arial, sans-serif" font-size="10.7" font-weight="700">No Data Edits Applied Yet</text>

  <!-- Full-width mobile search keeps its complete label; Ask AI gets its own target -->
  <rect x="1352" y="405" width="358" height="44" rx="8" fill="#ffffff" stroke="#cfd7e4"/>
  <circle cx="1370" cy="426" r="5.2" fill="none" stroke="#8d99aa" stroke-width="1.4"/>
  <path d="M1374 430l4 4" stroke="#8d99aa" stroke-width="1.4" stroke-linecap="round"/>
  <g clip-path="url(#mobileSearchText)">
    <text x="1384" y="430" fill="#8490a1" font-family="Inter, Arial, sans-serif" font-size="10.5">Search table or ask AI (e.g., 'show rows where column_3 &gt; 100')</text>
  </g>
  <rect x="1606" y="461" width="104" height="44" rx="8" fill="#7eacf0"/>
  <path d="M1624 470l2.5 5 5.4.8-4 3.8.9 5.4-4.8-2.6-4.9 2.6.9-5.4-4-3.8 5.4-.8z" fill="#ffffff"/>
  <text x="1665" y="488" text-anchor="middle" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="13.5" font-weight="700">Ask AI</text>
</svg>
