<svg xmlns="http://www.w3.org/2000/svg" width="780" height="700" viewBox="0 0 780 700" role="img" aria-labelledby="title desc">
  <title id="title">History Storage mobile visual proposal</title>
  <desc id="desc">An illustrative 320 pixel mobile History sheet with synthetic storage totals and report data. The content area is shown scrolled to a saved report. This is not an app screenshot.</desc>
  <defs>
    <clipPath id="screen-clip"><rect x="24" y="74" width="320" height="568" rx="18"/></clipPath>
    <clipPath id="sheet-scroll"><rect x="44" y="416" width="280" height="218"/></clipPath>
  </defs>
  <rect width="780" height="700" fill="#f4f6f9"/>
  <text x="24" y="32" fill="#182230" font-family="Arial,sans-serif" font-size="17" font-weight="700">HISTORY STORAGE · MOBILE AFTER-LAYOUT</text>
  <text x="24" y="54" fill="#647084" font-family="Arial,sans-serif" font-size="12">320 px viewport · synthetic labels, counts and sizes · illustrative proposal, not an app screenshot</text>

  <!-- 320 × 568 viewport with a subdued generic page behind the sheet -->
  <g clip-path="url(#screen-clip)">
    <rect x="24" y="74" width="320" height="568" fill="#e9edf3"/>
    <rect x="38" y="89" width="292" height="50" rx="6" fill="#f0f3f8" stroke="#ccd4e0"/>
    <text x="50" y="109" fill="#667085" font-family="Arial,sans-serif" font-size="10" font-weight="700">A new version is available.</text>
    <text x="50" y="125" fill="#667085" font-family="Arial,sans-serif" font-size="10">Refresh when ready to use the verified update.</text>
    <rect x="47" y="178" width="274" height="270" rx="12" fill="#f8fafc" stroke="#d6dce6"/>
    <text x="64" y="209" fill="#687386" font-family="Arial,sans-serif" font-size="12" font-weight="700">Analyze a file</text>
    <rect x="64" y="229" width="240" height="74" rx="8" fill="#fff" stroke="#d6dce6"/>
    <text x="81" y="270" fill="#8a94a5" font-family="Arial,sans-serif" font-size="11">Choose a CSV to begin</text>
    <rect x="24" y="74" width="320" height="568" fill="#172033" opacity="0.38"/>

    <!-- Near-full-height mobile sheet -->
    <rect x="32" y="82" width="304" height="552" rx="16" fill="#fff" stroke="#d4dae4"/>
    <rect x="32" y="82" width="304" height="72" rx="16" fill="#fff"/>
    <path d="M32 138h304" stroke="#edf0f4"/>
    <text x="48" y="108" fill="#182230" font-family="Arial,sans-serif" font-size="16" font-weight="700">Analysis History</text>
    <text x="48" y="126" fill="#5f6b7a" font-family="Arial,sans-serif" font-size="10.5">Reports are saved unencrypted in this</text>
    <text x="48" y="140" fill="#5f6b7a" font-family="Arial,sans-serif" font-size="10.5">browser.</text>
    <rect x="280" y="88" width="44" height="44" rx="7" fill="#fff" stroke="#dce1e9"/>
    <path d="m296 102 12 12m0-12-12 12" stroke="#485363" stroke-width="1.8" stroke-linecap="round"/>

    <!-- Search control: 44 px high -->
    <rect x="44" y="154" width="280" height="44" rx="7" fill="#f8fafc" stroke="#d6dce6"/>
    <circle cx="59" cy="175" r="5" fill="none" stroke="#8792a2" stroke-width="1.4"/>
    <path d="m63 179 4 4" stroke="#8792a2" stroke-width="1.4" stroke-linecap="round"/>
    <text x="74" y="179" fill="#8993a2" font-family="Arial,sans-serif" font-size="11">Search by title or file name…</text>

    <!-- Existing sort choices, with full 44 px button rows -->
    <rect x="44" y="198" width="280" height="44" rx="6" fill="#fff" stroke="#edf0f4"/>
    <rect x="44" y="198" width="94" height="44" rx="6" fill="#eaf0ff"/>
    <text x="53" y="224" fill="#274995" font-family="Arial,sans-serif" font-size="10.5" font-weight="700">Last modified ↓</text>
    <text x="157" y="224" fill="#475467" font-family="Arial,sans-serif" font-size="11">Created</text>
    <text x="250" y="224" fill="#475467" font-family="Arial,sans-serif" font-size="11">Name</text>

    <!-- Existing source selector and Clear all: both tall enough to tap -->
    <rect x="44" y="242" width="174" height="44" rx="6" fill="#f3f6fb"/>
    <text x="54" y="260" fill="#344054" font-family="Arial,sans-serif" font-size="10.5">Local data · 12.4 MB</text>
    <path d="m199 258 4 4 4-4" fill="none" stroke="#596579" stroke-width="1.2"/>
    <rect x="230" y="242" width="94" height="44" rx="6" fill="#fff" stroke="#ead0d0"/>
    <text x="247" y="260" fill="#a63f45" font-family="Arial,sans-serif" font-size="11" font-weight="600">Clear all</text>

    <!-- Pinned storage totals summary -->
    <path d="M32 286h304" stroke="#edf0f4"/>
    <text x="44" y="312" fill="#475467" font-family="Arial,sans-serif" font-size="10.5" font-weight="700" letter-spacing=".45">STORAGE INSPECTOR</text>
    <rect x="228" y="286" width="96" height="44" rx="6" fill="#fff" stroke="#d9e0e9"/>
    <path d="M241 307a6 6 0 1 1 2 4" fill="none" stroke="#687588" stroke-width="1.2"/>
    <path d="m239 307 4 1-1-4" fill="#687588"/>
    <text x="250" y="313" fill="#475467" font-family="Arial,sans-serif" font-size="10.5" font-weight="600">Refresh</text>
    <rect x="44" y="330" width="136" height="44" rx="5" fill="#f8fafc"/>
    <text x="52" y="345" fill="#5f6b7a" font-family="Arial,sans-serif" font-size="10">IndexedDB estimate</text>
    <text x="52" y="366" fill="#182230" font-family="Arial,sans-serif" font-size="15" font-weight="700">12.4 MB</text>
    <rect x="188" y="330" width="136" height="44" rx="5" fill="#f8fafc"/>
    <text x="196" y="345" fill="#5f6b7a" font-family="Arial,sans-serif" font-size="10">Scanned total</text>
    <text x="196" y="366" fill="#182230" font-family="Arial,sans-serif" font-size="15" font-weight="700">38.6 MB</text>
    <rect x="44" y="379" width="280" height="8" rx="4" fill="#e5e9f0"/>
    <rect x="44" y="379" width="66" height="8" rx="4" fill="#80a2e8"/>
    <rect x="110" y="379" width="91" height="8" fill="#c8d4e5"/>
    <rect x="201" y="379" width="123" height="8" rx="4" fill="#e79a54"/>
    <text x="44" y="400" fill="#5f6b7a" font-family="Arial,sans-serif" font-size="10">Browser origin estimate: 31.2 MB</text>
    <text x="44" y="412" fill="#5f6b7a" font-family="Arial,sans-serif" font-size="10">Separate measurement; may differ from scanned total.</text>
    <path d="M32 416h304" stroke="#edf0f4"/>

    <!-- One scroll area; depicted after a short scroll with a saved report in view -->
    <g clip-path="url(#sheet-scroll)">
      <rect x="44" y="416" width="280" height="44" fill="#fff"/>
      <circle cx="53" cy="438" r="4" fill="#e79a54"/>
      <text x="65" y="435" fill="#273244" font-family="Arial,sans-serif" font-size="11.5" font-weight="600">Cache Storage</text>
      <text x="65" y="450" fill="#7b8797" font-family="Arial,sans-serif" font-size="9.5">3 caches</text>
      <text x="226" y="442" fill="#475467" font-family="Arial,sans-serif" font-size="10.5">26.2 MB</text>
      <rect x="280" y="416" width="44" height="44" rx="5" fill="#fff"/>
      <path d="M296 430h12m-10 0 1 17h6l1-17m-7-3h6" fill="none" stroke="#596579" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>

      <rect x="44" y="460" width="280" height="28" fill="#f8fafc"/>
      <text x="48" y="478" fill="#475467" font-family="Arial,sans-serif" font-size="9.5" font-weight="700" letter-spacing=".35">SAVED REPORTS · 3 ITEMS</text>

      <rect x="44" y="488" width="280" height="134" fill="#fff"/>
      <rect x="48" y="496" width="26" height="26" rx="6" fill="#f1f5f9"/>
      <path d="M56 501h7l4 4v12H56z M63 501v4h4" fill="none" stroke="#64748b" stroke-width="1.2"/>
      <text x="82" y="504" fill="#1f2937" font-family="Arial,sans-serif" font-size="11.5" font-weight="700">sample-report.csv</text>
      <text x="82" y="518" fill="#718096" font-family="Arial,sans-serif" font-size="9.1">Created · 29 Sep, 10:14</text>
      <text x="82" y="530" fill="#718096" font-family="Arial,sans-serif" font-size="9.1">Modified · 29 Sep, 11:02</text>
      <rect x="44" y="534" width="280" height="44" rx="5" fill="#f8fafc"/>
      <path d="m57 553 4 4-4 4" fill="none" stroke="#526174" stroke-width="1.2"/>
      <text x="69" y="563" fill="#475467" font-family="Arial,sans-serif" font-size="10.5" font-weight="600">2 earlier versions</text>
      <rect x="82" y="578" width="190" height="44" rx="6" fill="#fff" stroke="#cbd5e1"/>
      <text x="107" y="605" fill="#273244" font-family="Arial,sans-serif" font-size="11" font-weight="600">Resume analysis</text>
      <rect x="280" y="578" width="44" height="44" rx="6" fill="#fff" stroke="#cbd5e1"/>
      <circle cx="302" cy="592" r="1.6" fill="#526174"/>
      <circle cx="302" cy="600" r="1.6" fill="#526174"/>
      <circle cx="302" cy="608" r="1.6" fill="#526174"/>
      <rect x="44" y="622" width="280" height="12" fill="#fff"/>
    </g>
    <rect x="328" y="416" width="3" height="218" rx="1.5" fill="#eef0f4"/>
    <rect x="328" y="452" width="3" height="91" rx="1.5" fill="#8490a0"/>
  </g>

  <!-- Review callouts -->
  <g font-family="Arial,sans-serif">
    <path d="M352 314h28l15-15" fill="none" stroke="#8a96a7" stroke-width="1.2"/>
    <circle cx="395" cy="299" r="3" fill="#526174"/>
    <text x="407" y="296" fill="#263244" font-size="13" font-weight="700">Keep both totals prominent</text>
    <text x="407" y="315" fill="#5f6b7a" font-size="11">Labels stay beside the figures; the color bar</text>
    <text x="407" y="331" fill="#5f6b7a" font-size="11">remains supporting detail.</text>

    <path d="M352 438h26l17 39" fill="none" stroke="#8a96a7" stroke-width="1.2"/>
    <circle cx="395" cy="477" r="3" fill="#526174"/>
    <text x="407" y="467" fill="#263244" font-size="13" font-weight="700">One internal scroll area</text>
    <text x="407" y="486" fill="#5f6b7a" font-size="11">Storage categories and saved reports remain</text>
    <text x="407" y="502" fill="#5f6b7a" font-size="11">reachable; report actions can scroll fully clear.</text>

    <path d="M352 602h25l20-44" fill="none" stroke="#8a96a7" stroke-width="1.2"/>
    <circle cx="397" cy="558" r="3" fill="#526174"/>
    <text x="407" y="552" fill="#263244" font-size="13" font-weight="700">Every action target ≥ 44 × 44 px</text>
    <text x="407" y="571" fill="#5f6b7a" font-size="11">Clear labels and full-size hit areas for close,</text>
    <text x="407" y="587" fill="#5f6b7a" font-size="11">refresh, clear, delete, versions and report actions.</text>

    <rect x="407" y="612" width="336" height="42" rx="6" fill="#eef2f7"/>
    <text x="420" y="630" fill="#475467" font-size="10.5" font-weight="700">Illustration only</text>
    <text x="420" y="646" fill="#5f6b7a" font-size="10.5">Not a real app screenshot. All sample values are synthetic.</text>
  </g>
</svg>
