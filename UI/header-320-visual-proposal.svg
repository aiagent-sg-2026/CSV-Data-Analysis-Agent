<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" role="img" aria-labelledby="title desc">
  <title id="title">Illustration: proposed two-row mobile header at 320 pixels</title>
  <desc id="desc">A clearly labeled UI illustration. The complete AI Analysis title occupies the first row. Five square 44-pixel controls sit in a second row. A small desktop inset shows the existing single-row desktop layout unchanged.</desc>
  <defs>
    <style>
      .label{font:600 12px system-ui,sans-serif;letter-spacing:1.8px;fill:#64748b}.body{font:14px system-ui,sans-serif;fill:#334155}.title{font:700 20px system-ui,sans-serif;fill:#111827}.ctl{font:600 13px system-ui,sans-serif;fill:#334155}.white{fill:#fff}.blue{fill:#315eea}
    </style>
  </defs>
  <rect width="640" height="420" fill="#f1f5f9"/>
  <text x="24" y="32" class="label">ILLUSTRATION — PROPOSED RESPONSIVE HEADER</text>
  <text x="24" y="55" class="body">Mobile • 320 px viewport</text>
  <rect x="24" y="72" width="320" height="178" rx="16" fill="#fff" stroke="#cbd5e1"/>
  <rect x="36" y="84" width="296" height="58" rx="10" fill="#f8fafc"/>
  <text x="48" y="120" class="title">AI Analysis</text>
  <text x="36" y="162" class="label">TOOLS</text>
  <g transform="translate(36 174)">
    <rect width="44" height="44" rx="9" class="blue"/><text x="22" y="27" text-anchor="middle" class="white" font-size="19">＋</text>
    <rect x="56" width="44" height="44" rx="9" class="white" stroke="#cbd5e1"/><text x="78" y="27" text-anchor="middle" class="ctl">◷</text>
    <rect x="112" width="44" height="44" rx="9" class="white" stroke="#cbd5e1"/><text x="134" y="27" text-anchor="middle" class="ctl">&lt;/&gt;</text>
    <rect x="168" width="44" height="44" rx="9" class="white" stroke="#cbd5e1"/><text x="190" y="27" text-anchor="middle" class="ctl">···</text>
    <rect x="224" width="44" height="44" rx="9" class="blue"/><text x="246" y="27" text-anchor="middle" class="white">•••</text>
  </g>
  <text x="36" y="239" class="body" font-size="12">Five 44 × 44 px controls; title never competes for row width.</text>
  <rect x="24" y="270" width="592" height="126" rx="14" fill="#fff" stroke="#cbd5e1"/>
  <text x="40" y="296" class="label">DESKTOP INSET • LAYOUT PRESERVED</text>
  <text x="40" y="328" class="title" font-size="17">AI Analysis</text>
  <g transform="translate(405 307)">
    <rect width="48" height="28" rx="6" fill="#315eea"/><text x="24" y="18" text-anchor="middle" class="white" font-size="11">＋ New</text>
    <rect x="54" width="62" height="28" rx="6" fill="#fff" stroke="#cbd5e1"/><text x="85" y="18" text-anchor="middle" class="ctl" font-size="10">◷ History</text>
    <rect x="122" width="72" height="28" rx="6" fill="#fff" stroke="#cbd5e1"/><text x="158" y="18" text-anchor="middle" class="ctl" font-size="10">&lt;/&gt; Data</text>
  </g>
  <text x="40" y="365" class="body" font-size="12">Keep the current one-row title and right-aligned actions at desktop widths.</text>
</svg>
