<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title desc">
  <title id="title">AI Long-Term Memory compact search — draft illustration</title>
  <desc id="desc">A mobile proposal showing compact keyword search results above the full stored memory list. A selected result is visibly linked to its full memory, which retains delete and exact provenance actions. All content is synthetic. This is not a real app screenshot.</desc>
  <defs>
    <clipPath id="sheet-scroll"><rect x="24" y="566" width="342" height="202" rx="2"/></clipPath>
  </defs>

  <!-- Synthetic app backdrop and dim overlay. -->
  <rect width="390" height="844" fill="#e9edf3"/>
  <rect x="0" y="0" width="390" height="62" fill="#f8fafc"/>
  <path d="M0 61.5h390" stroke="#d7dce5"/>
  <text x="14" y="37" fill="#202938" font-family="Arial,sans-serif" font-size="17" font-weight="700">Assistant</text>
  <rect x="131" y="19" width="46" height="22" rx="5" fill="#edf1fb" stroke="#d9dfed"/>
  <text x="138" y="34" fill="#4b5e91" font-family="Arial,sans-serif" font-size="10" font-weight="700">Pi Lab</text>
  <circle cx="206" cy="30" r="5.5" fill="none" stroke="#465264" stroke-width="1.3"/>
  <path d="M250 25l1.5 3.6 3.8.3-2.9 2.5.9 3.7-3.3-2-3.3 2 .9-3.7-2.9-2.5 3.8-.3z" fill="#465264"/>
  <path d="M299 26h13m-13 4h13m-13 4h13" stroke="#465264" stroke-width="1.3" stroke-linecap="round"/>
  <path d="m354 26 5 5-5 5" fill="none" stroke="#465264" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="13" y="82" width="364" height="354" rx="9" fill="#f7f9fc" stroke="#dbe1e9"/>
  <text x="26" y="108" fill="#758094" font-family="Arial,sans-serif" font-size="11" font-weight="700">AI ANALYSIS</text>
  <rect x="26" y="121" width="215" height="10" rx="4" fill="#dfe5ed"/>
  <rect x="26" y="141" width="320" height="7" rx="3.5" fill="#e4e9f0"/>
  <rect x="26" y="157" width="290" height="7" rx="3.5" fill="#e4e9f0"/>
  <rect x="26" y="185" width="337" height="65" rx="8" fill="#f4f7fb" stroke="#e1e6ed"/>
  <text x="39" y="207" fill="#657184" font-family="Arial,sans-serif" font-size="10" font-weight="700">RECOMMENDED NEXT STEP</text>
  <rect x="39" y="220" width="300" height="12" rx="5" fill="#dfe5ed"/>
  <rect x="0" y="0" width="390" height="844" fill="#182235" opacity=".43"/>

  <!-- Visible artifact label; this is a design proposal, not a captured runtime screen. -->
  <rect x="12" y="9" width="190" height="25" rx="5" fill="#19243a" opacity=".97"/>
  <text x="22" y="26" fill="#fff" font-family="Arial,sans-serif" font-size="11" font-weight="700" letter-spacing=".3">DRAFT / ILLUSTRATION</text>

  <!-- Mobile memory sheet. -->
  <rect x="12" y="64" width="366" height="716" rx="12" fill="#fff" stroke="#d4dae4"/>
  <circle cx="40" cy="91" r="14" fill="#e9efff"/>
  <path d="M34 91a6 6 0 1 1 6 6h-3l-3 2v-4a6 6 0 0 1 0-4z" fill="none" stroke="#4f6fc4" stroke-width="1.2" stroke-linejoin="round"/>
  <text x="61" y="98" fill="#182230" font-family="Arial,sans-serif" font-size="19" font-weight="700">AI Long-Term Memory</text>
  <rect x="320" y="69" width="44" height="44" rx="7" fill="#fff" stroke="#e1e5eb"/>
  <path d="m336 84 12 12m0-12-12 12" stroke="#4b5563" stroke-width="1.6" stroke-linecap="round"/>
  <text x="26" y="132" fill="#586577" font-family="Arial,sans-serif" font-size="12">4 items</text>
  <circle cx="80" cy="128" r="1.5" fill="#8993a2"/>
  <text x="88" y="132" fill="#586577" font-family="Arial,sans-serif" font-size="12">Using ~12.50 KB</text>
  <rect x="268" y="108" width="96" height="44" rx="6" fill="#fff" stroke="#cfd7e2"/>
  <text x="280" y="135" fill="#365da9" font-family="Arial,sans-serif" font-size="10.5" font-weight="600">View scope IDs</text>
  <path d="M26 159h338" stroke="#e5e9ef"/>

  <!-- Existing search controls remain grouped together. -->
  <rect x="26" y="171" width="338" height="116" rx="9" fill="#f8fafc" stroke="#dfe4eb"/>
  <text x="38" y="194" fill="#273244" font-family="Arial,sans-serif" font-size="12" font-weight="700">Test Similarity Search</text>
  <circle cx="42" cy="213" r="3.2" fill="#54a176"/>
  <text x="51" y="217" fill="#667386" font-family="Arial,sans-serif" font-size="11">Local memory model is ready.</text>
  <rect x="38" y="231" width="231" height="44" rx="6" fill="#fff" stroke="#cfd7e2"/>
  <text x="49" y="258" fill="#273244" font-family="Arial,sans-serif" font-size="11">Town prices</text>
  <rect x="277" y="231" width="75" height="44" rx="6" fill="#3f63dc"/>
  <text x="294" y="258" fill="#fff" font-family="Arial,sans-serif" font-size="12" font-weight="700">Search</text>

  <!-- Compact results preserve a useful excerpt and source while avoiding a duplicate full document. -->
  <text x="26" y="313" fill="#273244" font-family="Arial,sans-serif" font-size="12" font-weight="700">Top Results</text>
  <rect x="26" y="324" width="338" height="91" rx="8" fill="#fff" stroke="#557be0" stroke-width="1.7"/>
  <text x="38" y="344" fill="#273244" font-family="Arial,sans-serif" font-size="11.5" font-weight="700">Sum Resale Price by Town</text>
  <rect x="38" y="352" width="143" height="20" rx="5" fill="#eef2ff"/>
  <text x="46" y="366" fill="#405fae" font-family="Arial,sans-serif" font-size="9.5" font-weight="700">Keyword match · fallback</text>
  <text x="38" y="389" fill="#475467" font-family="Arial,sans-serif" font-size="10.5">Total resale price by town · 3 groups.</text>
  <text x="38" y="404" fill="#6d7888" font-family="Arial,sans-serif" font-size="9.5">Origin · Analysis card</text>
  <rect x="26" y="423" width="338" height="63" rx="8" fill="#fff" stroke="#dfe4eb"/>
  <text x="38" y="443" fill="#273244" font-family="Arial,sans-serif" font-size="11" font-weight="700">90-row dataset cleaning plan</text>
  <rect x="38" y="450" width="128" height="18" rx="5" fill="#eef2f8"/>
  <text x="46" y="463" fill="#586577" font-family="Arial,sans-serif" font-size="9.5" font-weight="600">Vector similarity</text>
  <text x="176" y="463" fill="#6d7888" font-family="Arial,sans-serif" font-size="9.5">Dataset · 90 rows</text>

  <!-- The existing clear action remains available above the full memory list. -->
  <text x="26" y="524" fill="#273244" font-family="Arial,sans-serif" font-size="12" font-weight="700">All Stored Memories (4)</text>
  <rect x="226" y="497" width="138" height="44" rx="6" fill="#fff" stroke="#ead5d5"/>
  <text x="237" y="524" fill="#ad4548" font-family="Arial,sans-serif" font-size="10.5" font-weight="600">Clear Report Memory</text>
  <path d="M26 550h338" stroke="#e5e9ef"/>

  <!-- Selected stored memory still contains the full evidence; its compact search result above points here. -->
  <g clip-path="url(#sheet-scroll)">
    <rect x="26" y="560" width="338" height="213" rx="8" fill="#f8fafc" stroke="#557be0" stroke-width="1.8"/>
    <rect x="38" y="570" width="122" height="20" rx="5" fill="#eef2ff"/>
    <text x="46" y="584" fill="#405fae" font-family="Arial,sans-serif" font-size="9.5" font-weight="700">Selected from results</text>
    <rect x="310" y="564" width="44" height="44" rx="6" fill="#fff" stroke="#e1e5eb"/>
    <path d="M326 579h12m-10 0 1 17h6l1-17m-7-3h6" fill="none" stroke="#687588" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="38" y="609" fill="#273244" font-family="Arial,sans-serif" font-size="11" font-weight="700">Sum Resale Price by Town</text>
    <text x="38" y="628" fill="#273244" font-family="Arial,sans-serif" font-size="10">Description: Total resale_price grouped by Town.</text>
    <text x="38" y="645" fill="#273244" font-family="Arial,sans-serif" font-size="10">Review the result table first, then use the chart</text>
    <text x="38" y="662" fill="#273244" font-family="Arial,sans-serif" font-size="10">as a compact visual summary (3 rows).</text>
    <text x="38" y="680" fill="#6d7888" font-family="Arial,sans-serif" font-size="9.5">Town · Sum Resale Price · 3 groups</text>
    <text x="38" y="697" fill="#6d7888" font-family="Arial,sans-serif" font-size="9.5">Origin · Analysis card: Sum Resale Price by Town</text>
    <rect x="38" y="709" width="314" height="44" rx="6" fill="#fff" stroke="#cfd7e2"/>
    <text x="51" y="736" fill="#365da9" font-family="Arial,sans-serif" font-size="11" font-weight="600">Exact provenance</text>
    <path d="m335 727 4 4 4-4" fill="none" stroke="#365da9" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="38" y="770" fill="#6d7888" font-family="Arial,sans-serif" font-size="9.5">Full stored text and evidence remain available on scroll.</text>
  </g>
  <rect x="366" y="566" width="2" height="202" rx="1" fill="#eef0f4"/>
  <rect x="366" y="573" width="2" height="112" rx="1" fill="#98a2b1"/>

  <text x="22" y="804" fill="#fff" font-family="Arial,sans-serif" font-size="10" font-weight="700">DRAFT · synthetic example content · not a runtime capture</text>
</svg>
